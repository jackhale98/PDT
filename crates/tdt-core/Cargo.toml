[package]
name = "tessera-design-toolkit-core"
description = "Core library for Tessera Design Toolkit (TDT) - engineering artifact management with requirements, risks, BOMs, tolerance analysis, and full traceability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["engineering", "requirements", "traceability", "fmea", "tolerance"]
categories = ["development-tools", "data-structures"]
readme = "../../README.md"

[lib]
name = "tdt_core"
path = "src/lib.rs"

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true

# Schema & Templates
jsonschema.workspace = true
tera.workspace = true

# Identity & Time
ulid.workspace = true
chrono.workspace = true

# Error Handling
thiserror.workspace = true
miette.workspace = true

# File System
walkdir.workspace = true
directories.workspace = true

# Utilities
rust-embed.workspace = true
rand.workspace = true

# 3D Tolerance Analysis
nalgebra.workspace = true

# Parsing (SysML import)
pest.workspace = true
pest_derive.workspace = true

# Cache
rusqlite.workspace = true
sha2.workspace = true
csv.workspace = true

# Git (pure-Rust, works on mobile)
# gix backs local git operations ONLY on mobile targets (no `git` binary
# there); desktop/CLI builds use shell git and never compile gix.
# The `gix-vc` feature exists so CI/desktop can compile-check the gix path.
gix = { workspace = true, optional = true }

# CLI deps temporarily in core (TODO: refactor wizard module to CLI)
clap.workspace = true
dialoguer.workspace = true
console.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[features]
gix-vc = ["dep:gix"]

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
gix = { workspace = true }
